services:
  db:
    image: postgres:16-alpine
    container_name: appcuadre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appcuadre
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appcuadre"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appcuadre-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ":8080"
      DATABASE_URL: "host=db user=postgres password=postgres dbname=appcuadre port=5432 sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
